<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/toastr.min.css">
    <title>Toaster</title>
</head>
<body >
    <button class="btn-success" onclick="success_toast()" >Success</button>
    <button class="btn-success" onclick="error_toast()" >Error</button>
    <script src="js/jquery.js"></script>
    <script src="js/toastr.min.js"></script>
    <script>
        function success_toast() {
            toastr.options = {
  "closeButton": true,
  "debug": false,
  "newestOnTop": true,
  "progressBar":true,
  "positionClass": "toast-top-center",
  "preventDuplicates": false,
  "onclick": null,
  "showDuration": "300",
  "hideDuration": "1000",
  "timeOut": "5000",
  "extendedTimeOut": "1000",
  "showEasing": "swing",
  "hideEasing": "linear",
  "showMethod": "fadeIn",
  "hideMethod": "fadeOut"
};
            toastr.success("Login Succesfully!","Success",)
        }
        function error_toast() {
            toastr.options = {
  "closeButton": true,
  "debug": false,
  "newestOnTop": true,
  "progressBar": true,
  "positionClass": "toast-top-center",
  "preventDuplicates": false,
  "onclick": null,
  "showDuration": "300",
  "hideDuration": "1000",
  "timeOut": "5000",
  "extendedTimeOut": "1000",
  "showEasing": "swing",
  "hideEasing": "linear",
  "showMethod": "fadeIn",
  "hideMethod": "fadeOut"
};

toastr.error("Login Successfully!", "Success");
        }
    </script>
</body>
</html>
